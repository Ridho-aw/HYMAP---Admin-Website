<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Data Pelanggan</title>
    <!-- Load Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Load Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #333333; /* Dark background backdrop simulation */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Custom Modal Card Matching the UI Screenshot */
        .custom-modal-card {
            background-color: #E2ECE9; /* Soft mint / pastel sage green */
            border-radius: 6px;
            position: relative;
            width: 100%;
            max-width: 950px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            overflow: visible; /* Allows header banner to stick out if needed, or structured precisely */
            padding: 40px 50px 40px 50px;
        }

        /* Header Banner hanging out to the left */
        .modal-header-banner {
            position: absolute;
            top: -24px;
            left: -30px;
            background-color: #3b7080; /* Deep teal blue */
            color: #ffffff;
            padding: 14px 35px;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            border-radius: 2px;
        }

        /* Close Button 'X' at top right */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            background: none;
            border: none;
            font-size: 2rem;
            color: #2b2b2b;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }
        .close-btn:hover {
            color: #000000;
        }

        /* Form Labels styling */
        .form-label-custom {
            color: #264653; /* Deep navy/teal blue label */
            font-weight: 600;
            font-size: 0.95rem;
            text-align: right;
            padding-top: 8px;
        }

        /* Form Controls Styling */
        .form-control-custom, .form-select-custom {
            background-color: #f1f7f5;
            border: 1px solid #d0deda;
            color: #8c9c98;
            border-radius: 4px;
            padding: 10px 14px;
            font-size: 0.95rem;
            box-shadow: none;
        }
        .form-control-custom:focus, .form-select-custom:focus {
            background-color: #ffffff;
            border-color: #3b7080;
            box-shadow: 0 0 0 0.2rem rgba(59, 112, 128, 0.15);
            color: #333333;
        }

        /* Placeholder text styling */
        ::placeholder {
            color: #b0c2bd !important;
            opacity: 1;
        }

        /* Action Buttons */
        .btn-csv {
            background-color: #f1f7f5;
            border: 1px solid #cce0db;
            color: #264653;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .btn-csv:hover {
            background-color: #e2ece9;
            color: #1a3138;
            border-color: #b3d1cb;
        }

        .btn-tambah {
            background-color: #f1f7f5;
            border: 1px solid #cce0db;
            color: #264653;
            font-weight: 600;
            padding: 10px 36px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .btn-tambah:hover {
            background-color: #e2ece9;
            color: #1a3138;
            border-color: #b3d1cb;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 768px) {
            .custom-modal-card {
                padding: 30px 20px;
            }
            .modal-header-banner {
                position: relative;
                top: 0;
                left: 0;
                margin-bottom: 25px;
                text-align: center;
                width: 100%;
            }
            .form-label-custom {
                text-align: left;
                padding-top: 0;
                margin-bottom: 4px;
            }
        }
    </style>
</head>
<body>

    <div class="custom-modal-card mt-4 mb-4">
        <!-- Header Banner bertuliskan 'Tambah Data Pelanggan' menjorok keluar -->
        <div class="modal-header-banner">
            Tambah Data Pelanggan
        </div>

        <!-- Tombol Close 'X' di pojok kanan atas -->
        <button type="button" class="close-btn" aria-label="Close" onclick="handleClose()">×</button>

        <!-- Form Input Container -->
        <form id="formTambahPelanggan" class="mt-5 pt-3">
            
            <!-- Nama -->
            <div class="row mb-3 align-items-center">
                <div class="col-md-3">
                    <label class="form-label form-label-custom">Nama: *</label>
                </div>
                <div class="col-md-9">
                    <input type="text" class="form-control form-control-custom" placeholder="Masukkan nama pelanggan" required>
                </div>
            </div>

            <!-- No Telepon -->
            <div class="row mb-3 align-items-center">
                <div class="col-md-3">
                    <label class="form-label form-label-custom">No Telepon: *</label>
                </div>
                <div class="col-md-9">
                    <input type="text" class="form-control form-control-custom" placeholder="Masukkan no telepon pelanggan" required>
                </div>
            </div>

            <!-- Alamat -->
            <div class="row mb-3 align-items-center">
                <div class="col-md-3">
                    <label class="form-label form-label-custom">Alamat: *</label>
                </div>
                <div class="col-md-9">
                    <input type="text" class="form-control form-control-custom" placeholder="Masukkan alamat pelanggan" required>
                </div>
            </div>

            <!-- Rute -->
            <div class="row mb-3 align-items-center">
                <div class="col-md-3">
                    <label class="form-label form-label-custom">Rute: *</label>
                </div>
                <div class="col-md-9">
                    <select class="form-select form-select-custom" required>
                        <option selected disabled value="">Rute</option>
                        <option value="rute1">Rute A (Utara)</option>
                        <option value="rute2">Rute B (Selatan)</option>
                        <option value="rute3">Rute C (Timur)</option>
                    </select>
                </div>
            </div>

            <!-- Wilayah -->
            <div class="row mb-3 align-items-center">
                <div class="col-md-3">
                    <label class="form-label form-label-custom">Wilayah: *</label>
                </div>
                <div class="col-md-9">
                    <select class="form-select form-select-custom" required>
                        <option selected disabled value="">Wilayah</option>
                        <option value="wilayah1">Wilayah 1</option>
                        <option value="wilayah2">Wilayah 2</option>
                        <option value="wilayah3">Wilayah 3</option>
                    </select>
                </div>
            </div>

            <!-- Google Maps Link -->
            <div class="row mb-4 align-items-center">
                <div class="col-md-3">
                    <label class="form-label form-label-custom">Google Maps Link:</label>
                </div>
                <div class="col-md-9">
                    <input type="text" class="form-control form-control-custom" placeholder="Masukkan alamat pelanggan">
                </div>
            </div>

            <!-- Action Buttons Row -->
            <div class="row">
                <div class="col-md-9 offset-md-3 d-flex flex-wrap gap-3">
                    <button type="button" class="btn btn-csv" onclick="handleImportCSV()">Tambah Dengan CSV</button>
                    <button type="submit" class="btn btn-tambah">Tambah</button>
                </div>
            </div>

        </form>
    </div>

    <!-- Custom Message Box Modal (Alternative to alert) -->
    <div class="modal fade" id="messageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-light">
                    <h5 class="modal-title" id="messageTitle">Informasi</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="messageBody">
                    Pesan informasi.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Custom message box helper instead of alert()
        function showMessage(title, text) {
            document.getElementById('messageTitle').innerText = title;
            document.getElementById('messageBody').innerText = text;
            var myModal = new bootstrap.Modal(document.getElementById('messageModal'));
            myModal.show();
        }

        function handleClose() {
            showMessage("Tutup Modal", "Tombol tutup diklik. Dialog modal dapat ditutup di sini.");
        }

        function handleImportCSV() {
            showMessage("Import CSV", "Fitur tambah data dengan file CSV dipilih.");
        }

        // Form submission handling
        document.getElementById('formTambahPelanggan').addEventListener('submit', function(e) {
            e.preventDefault();
            showMessage("Berhasil", "Data pelanggan berhasil ditambahkan!");
        });
    </script>
</body>
</html>
