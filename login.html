<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HYMAP LOGIN</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        font-family: poppins;
      }

      .kiri {
        background-color: #3b7080;
      }

      button {
        margin-top: 10px;
        background-color: #3b7080;
        border-style: none;
        border-radius: 15px;
        padding: 7px 14px;
        color: white;
        cursor: pointer;

        outline: 2px solid transparent;
        outline-offset: 0px;
        transition: all 0.3s ease;
      }

      button:hover {
        outline-color: #3b7080;
        outline-offset: 4px;
      }

      @media (max-width: 768px) {
        .halo {
          min-height: auto;
        }
        .kiri {
          align-items: center;
          min-height: 100px;
          padding: 10px;
        }

        .kanan {
          min-height: 400px;
          text-align: center;
          justify-content: start;
          margin-top: 50px;
        }

        .kanan h3 {
          font-size: large;
        }
      }
    </style>
  </head>
  <body>
    <div class="halo container-fluid">
      <div class="row min-vh-100">
        <!-- Bagian kiri -->
        <div
          class="kiri md:col-4 fg-white d-flex flex-column justify-content-center p-10"
        >
          <h1 class="h1-kiri fs-5xl fw-bold">HYMAP</h1>
          <p class="p-kiri fst-italic">Hydro Management Application</p>
        </div>

        <!-- Bagian kanan -->
        <div
          class="kanan md:col-7 bg-white fg-dark d-flex flex-column justify-content-center align-items-center"
        >
          <h3 class="mb-10">Silakan Login terlebih dahulu</h3>

          <form class="w-100 rounded-9" style="max-width: 400px">
            <div class="mb-3">
              <input
                type="text"
                class="form-control rounded-9"
                id="username"
                placeholder="username"
              />
            </div>

            <div class="mb-3">
              <input
                type="password"
                class="form-control rounded-9"
                id="password"
                placeholder="password"
              />
            </div>

            <button type="submit" class="btn btn-success w-100">Login</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
