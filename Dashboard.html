<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#333333] flex flex-col min-h-screen font-['Segoe_UI',Tahoma,Geneva,Verdana,sans-serif]">

    <header
        class="bg-[#366c82] text-white h-[60px] flex justify-between items-center px-[30px] shadow-[0_2px_4px_rgba(0,0,0,0.1)]">
        <div class="text-[24px] font-[800] tracking-[1px]">HYMAP</div>
        <div class="flex items-center gap-[20px]">
            <a href="#" class="text-white font-medium underline text-[16px]">Logout</a>
        </div>
    </header>

    <div class="flex flex-1">
        <aside class="w-[240px] bg-[#2b5768] text-white py-[30px] px-[20px] flex flex-col gap-[30px]">
            <div class="flex flex-col items-center text-center">
                <div class="w-[100px] h-[100px] rounded-full overflow-hidden mb-[15px] bg-[#e5a79a]">
                    <img src="Asset/Kos-Kosan Kunci Biru ; Blue Lock x Reader.jpg" alt="Avatar Admin"
                        class="w-full h-full object-cover">
                </div>
                <h3 class="text-[22px] font-[800] tracking-[1px]">ADMIN</h3>
            </div>

            <div class="flex flex-col gap-[12px]">
                <div class="text-[13px] font-[700] uppercase tracking-[0.5px]">MENU</div>
                <ul class="list-none flex flex-col gap-[14px]">
                    <li>
                        <a href="#"
                            class="text-[#e0e0e0] no-underline text-[13.5px] transition-colors duration-200 hover:text-white hover:font-bold">
                            Kelola Data Pelanggan
                        </a>
                    </li>
                    <li>
                        <a href="#"
                            class="text-[#e0e0e0] no-underline text-[13.5px] transition-colors duration-200 hover:text-white hover:font-bold">
                            Kelola Data Sopir
                        </a>
                    </li>
                    <li>
                        <a href="#"
                            class="text-[#e0e0e0] no-underline text-[13.5px] transition-colors duration-200 hover:text-white hover:font-bold">
                            Jadwal Pengiriman
                        </a>
                    </li>
                    <li>
                        <a href="#"
                            class="text-[#e0e0e0] no-underline text-[13.5px] transition-colors duration-200 hover:text-white hover:font-bold">
                            Info Penjualan
                        </a>
                    </li>
                    <li>
                        <a href="#"
                            class="text-[#e0e0e0] no-underline text-[13.5px] transition-colors duration-200 hover:text-white hover:font-bold">
                            Kelola Stok Galon
                        </a>
                    </li>
                    <li>
                        <a href="#"
                            class="text-[#e0e0e0] no-underline text-[13.5px] transition-colors duration-200 hover:text-white hover:font-bold">
                            Data Daerah Kiriman
                        </a>
                    </li>
                    <li>
                        <a href="#"
                            class="text-[#e0e0e0] no-underline text-[13.5px] transition-colors duration-200 hover:text-white hover:font-bold">
                            Pantau Sopir
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <main class="flex-1 bg-white p-[40px]">
            <h1 class="text-[32px] font-normal text-[#111] mb-[25px]">Welcome Back! Admin.</h1>
            <h2 class="text-[28px] font-[800] text-black mb-[20px]">Dahshboard Panel</h2>

            <div class="flex flex-col md:flex-row gap-[20px]">
                <div class="flex flex-col gap-[20px] flex-1">
                    <div class="bg-[#dcdcdc] rounded-[16px] h-[160px]"></div>
                    <div class="bg-[#dcdcdc] rounded-[16px] h-[160px]"></div>
                </div>
                <div class="flex-1">
                    <div class="bg-[#dcdcdc] rounded-[16px] h-[340px]"></div>
                </div>
            </div>
        </main>
    </div>

    <footer class="bg-[#dcdcdc] text-[#333333] py-[6px] px-[15px] text-[11px] border-t border-[#ccc]">
        <i>@2026 HYMAP CORPORATION</i>
    </footer>

</body>

</html>
